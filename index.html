<!DOCTYPE html>
<html lang="en" data-theme="light" data-reduced-motion="false">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AlgoVisualizer - See the algorithm work</title>
  <meta name="description" content="Step through sorting, searching, graph and data-structure algorithms one event at a time. A framework-free visualization platform built with plain HTML, CSS and JavaScript.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#4f46e5">

  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icons/favicon.svg">

  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">

  <script>
    // Apply the stored theme before first paint so there is no flash.
    (function () {
      try {
        var stored = JSON.parse(localStorage.getItem("av:prefs") || "{}");
        var theme = stored.theme || "system";
        if (theme === "system") {
          theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark" : "light";
        }
        document.documentElement.setAttribute("data-theme", theme);
        if (stored.reducedMotion) {
          document.documentElement.setAttribute("data-reduced-motion", "true");
        }
      } catch (e) { /* private mode or corrupt payload - fall back to CSS defaults */ }
    })();
  </script>
</head>
<body>
  <div class="app">
    <a class="skip-link" href="#main">Skip to content</a>

    <!-- .site-header is inserted here by js/app.js -->

    <div class="app-body">
      <!-- .sidebar and its scrim are inserted here by js/app.js -->
      <main class="main" id="main" tabindex="-1">
        <div class="view">
          <div class="page">
            <div class="empty-state" role="status">
              <div class="skeleton" style="width: 60%; height: 28px; margin-bottom: 12px;"></div>
              <div class="skeleton" style="width: 40%; height: 16px;"></div>
            </div>
          </div>
        </div>
      </main>
    </div>

    <footer class="site-footer">
      <div class="footer-inner">
        <div>
          <strong>AlgoVisualizer</strong> - Project 02 of a 10-project portfolio.
          Built with plain HTML, CSS and ES6+. No frameworks, no build step.
        </div>
        <nav class="footer-links" aria-label="Footer">
          <a href="#/algorithms">Algorithms</a>
          <a href="#/structures">Structures</a>
          <a href="#/learning">Lessons</a>
          <a href="#/quiz">Quiz</a>
          <a href="#/benchmark">Benchmark</a>
          <a href="#/compare">Compare</a>
        </nav>
      </div>
    </footer>
  </div>

  <!-- ====================================================================

  <script src="js/utils/random.js"></script>

</body>
</html>
